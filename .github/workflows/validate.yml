name: CI - Pull Request Validation

on:
  pull_request:
    branches: [ "main", "master", "dev" ]
  workflow_dispatch:

jobs:
  validate-hacs:
    name: HACS Action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"

  validate-hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Hassfest validation
        uses: "home-assistant/actions/hassfest@master"

  lint:
    name: Code Quality (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff check
        run: ruff check .

  tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-homeassistant-custom-component

      - name: Run Pytest
        run: |
          pytest -v tests/

  check-version-bump:
    name: Check manifest.json version bump
    if: github.base_ref == 'main' || github.base_ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify version has been incremented
        run: |
          LATEST_TAG=$(git tag -l "v[0-9]*" | grep -v "b" | sort -V | tail -n 1)
          CURRENT_VERSION="v$(python3 -c "import json; print(json.load(open('custom_components/eau_du_grand_lyon/manifest.json'))['version'])")"

          echo "Dernière release officielle : $LATEST_TAG"
          echo "Version actuelle du manifest : $CURRENT_VERSION"

          if [ -n "$LATEST_TAG" ] && [ "$CURRENT_VERSION" = "$LATEST_TAG" ]; then
            echo "::error::Le fichier manifest.json n'a pas été incrémenté ($CURRENT_VERSION est identique à la release $LATEST_TAG). Veuillez incrémenter la version avant de fusionner vers main."
            exit 1
          fi
          echo "Version validée : $CURRENT_VERSION est prête pour la release officielle."

