[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["tools", ".git", ".storage"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
]
ignore = [
    "E501", # line too long
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["custom_components.eau_du_grand_lyon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
norecursedirs = [".git"]
